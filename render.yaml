# Plantilla de despliegue para Render (https://render.com).
# Uso: en Render, "New" -> "Blueprint" -> apunta a este repositorio.
# El disco persistente es imprescindible: la base es SQLite y vive en disco.
services:
  - type: web
    name: trabajofacil
    runtime: node
    plan: starter          # el plan gratuito no incluye disco persistente
    buildCommand: |
      # Sin dependencias npm que instalar. El build arranca el servidor, ejecuta
      # las cuatro baterías de pruebas y solo despliega si todas pasan.
      node servidor/app.mjs & SRV=$!
      node -e "const w=async()=>{for(let i=0;i<40;i++){try{const r=await fetch('http://127.0.0.1:4174/');if(r.ok){console.log('servidor listo');return}}catch(e){}await new Promise(r=>setTimeout(r,500))}console.error('el servidor no arranco');process.exit(1)};w()" \
        && node herramientas/probar.mjs \
        && node herramientas/probar-flujo.mjs \
        && node herramientas/probar-subida.mjs \
        && node herramientas/diagnostico.mjs
      CODE=$?
      kill $SRV 2>/dev/null || true
      exit $CODE
    startCommand: node servidor/app.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TF_DB
        value: /var/data/trabajofacil.db
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
